<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Policy Letter — UTMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EF;
    --card:#FFFFFF;
    --ink:#1C1E1B;
    --ink-soft:#5B6367;
    --line:#DFDACD;
    --teal:#1E5631;
    --teal-soft:#E3EDE5;
    --amber:#B4772A;
    --amber-soft:#F6EBDA;
    --brick:#9B4132;
    --brick-soft:#F5E4E0;
    --neutral-fill:#EFEAE0;
    --radius:14px;
    --shadow:0 1px 2px rgba(35,42,46,0.04), 0 8px 24px rgba(35,42,46,0.06);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex; justify-content:center; padding:32px 16px;
  }
  .wrap{ width:100%; max-width:720px; }
  header{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  header img{ height:62px; width:auto; display:block; }
  header .school{ font-size:14px; color:var(--ink-soft); font-weight:700; letter-spacing:0.02em; }
  h1{ font-family:'Newsreader',serif; font-size:26px; font-weight:600; margin:0 0 6px; }
  .help{ font-size:14.5px; color:var(--ink-soft); margin:0 0 24px; line-height:1.5; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; }
  .occ-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .occ-grid{ grid-template-columns:1fr; } }
  .occ-btn{
    text-align:left; border:1.5px solid var(--line); border-radius:12px; padding:18px 18px;
    background:var(--card); cursor:pointer; font-family:'Inter',sans-serif;
  }
  .occ-btn .n{ font-family:'Newsreader',serif; font-size:20px; font-weight:600; margin-bottom:4px; }
  .occ-btn .d{ font-size:13px; color:var(--ink-soft); line-height:1.4; }
  .occ-btn.tier1{ background:var(--neutral-fill); border-color:var(--line); }
  .occ-btn.tier2{ background:var(--teal-soft); border-color:var(--teal); }
  .occ-btn.tier3{ background:var(--amber-soft); border-color:var(--amber); }
  .occ-btn.tier4{ background:var(--amber-soft); border-color:var(--amber); }
  .occ-btn.tier5{ background:var(--brick-soft); border-color:var(--brick); }
  .back-link{ background:none; border:none; color:var(--ink-soft); font-size:13.5px; cursor:pointer; padding:0; margin-bottom:16px; text-decoration:underline; font-family:'Inter',sans-serif; }
  .actions{ display:flex; gap:10px; margin-top:20px; }
  .btn-print{ font-family:'Inter',sans-serif; font-weight:600; font-size:14px; padding:11px 20px; border-radius:9px; border:none; background:var(--teal); color:#fff; cursor:pointer; }

  /* Print-ready letter styling — mirrors the wizard's printable template convention */
  .letter{ font-family:Georgia,'Times New Roman',serif; color:#1a1a1a; }
  .letter .school-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .letter .school-header img{ height:88px; width:auto; display:block; }
  .letter .school-line{ font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#666; font-family:Georgia,serif; }
  .letter h2.title{ font-size:22px; margin:0 0 4px; font-weight:600; font-family:Georgia,serif; }
  .letter .subtitle{ font-size:12.5px; color:#555; margin-bottom:18px; }
  .letter .field-row{ display:flex; gap:24px; margin-bottom:18px; flex-wrap:wrap; }
  .letter .field-row .field{ flex:1; min-width:140px; }
  .letter .field-row .fill-line{ border-bottom:1px solid #999; height:30px; }
  .letter .field-row input.fill-line{
    display:block; width:100%; box-sizing:border-box;
    border:none; border-bottom:1px solid #999; background:transparent;
    font-family:Georgia,'Times New Roman',serif; font-size:13.5px; color:#1a1a1a;
    padding:0 0 2px; outline:none;
  }
  .letter .field-row input.fill-line:focus{ border-bottom-color:#1E5631; }
  .letter .field-row .fl{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:#777; display:block; margin-top:5px; }
  .letter p{ font-size:13.5px; line-height:1.55; margin:0 0 14px; }
  .letter section{ margin-bottom:16px; }
  .letter section h3{ font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em; color:#333; border-bottom:1px solid #999; padding-bottom:4px; margin:0 0 10px; }
  .letter ul.checklist{ list-style:none; padding:0; margin:0 0 26px; }
  .letter ul.checklist li{ font-size:13.5px; margin-bottom:12px; padding-left:26px; position:relative; line-height:1.4; }
  .letter ul.checklist li:before{ content:"\2610"; position:absolute; left:0; font-size:16px; }
  .letter .sign-row{ display:flex; gap:30px; flex-wrap:wrap; }
  .letter .sign-row .sig{ flex:1; min-width:160px; }
  .letter .sign-row .sig .fill-line{ border-bottom:1px solid #333; height:38px; }
  .letter .sign-row .sig .fl{ font-size:10.5px; color:#666; text-transform:uppercase; letter-spacing:0.04em; display:block; margin-top:5px; }

  @media print{
    header, .help, .back-link, .actions{ display:none; }
    body{ padding:0; background:#fff; }
    .card{ border:none; box-shadow:none; padding:0; }
    @page{ size:letter; margin:0.75in; }
  }
</style>
</head>

        <h2 class="title">Device Policy Acknowledgment</h2>
        <div class="subtitle">${o.ordinal} Occurrence &mdash; Board Policy &amp; Regulation 5516</div>

        <div class="field-row">
          <div class="field"><input type="text" class="fill-line" data-field="studentName" value="${studentDetails.studentName}"><span class="fl">Student Name</span></div>
          <div class="field"><input type="text" class="fill-line" data-field="grade" value="${studentDetails.grade}"><span class="fl">Grade</span></div>
          <div class="field"><input type="text" class="fill-line" data-field="dateOfIncident" value="${studentDetails.dateOfIncident}"><span class="fl">Date of Incident</span></div>
        </div>

        <p>This letter confirms that the above student's personal device was confiscated for a violation of Board Policy &amp; Regulation 5516, the district's device-use policy. This is the student's ${o.ordinal.toLowerCase()} documented violation of this policy during the current school year.</p>

        <section>
          <h3>Today's Consequence</h3>
          <p>${o.consequence}</p>
        </section>

        <section>
          <h3>If This Happens Again</h3>
          <p>${o.nextUp}</p>
        </section>

        <ul class="checklist">
          ${o.checklist.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <div class="sign-row">
          <div class="sig"><div class="fill-line"></div><span class="fl">${o.signerLabel} &nbsp;&nbsp; Date</span></div>
          <div class="sig"><div class="fill-line"></div><span class="fl">School Official Signature &nbsp;&nbsp; Date</span></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn-print" onclick="window.print()">Print this letter</button>
      </div>
    </div>
  `;

  document.querySelectorAll('input[data-field]').forEach(inp => {
    inp.addEventListener('input', () => { studentDetails[inp.dataset.field] = inp.value; });
  });
  const firstField = document.querySelector('input[data-field="studentName"]');
  if (firstField) setTimeout(() => firstField.focus(), 0);
}

renderPicker();
</script>
